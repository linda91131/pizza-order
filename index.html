<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>達美樂歸仁店｜團購訂購單</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--text:#1a1a1a;--sub:#666;--line:#e3e3df;--brand:#006491;--red:#e31837;--chip:#eef4f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--card:#1e1e1e;--text:#f1f1f1;--sub:#aaa;--line:#333;--brand:#5ab6e6;--red:#ff5a73;--chip:#22313b}}
:root[data-theme="dark"]{--bg:#141414;--card:#1e1e1e;--text:#f1f1f1;--sub:#aaa;--line:#333;--brand:#5ab6e6;--red:#ff5a73;--chip:#22313b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.5;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;padding:14px}
header{background:var(--brand);color:#fff;border-radius:14px;padding:16px}
header h1{margin:0 0 6px;font-size:20px}
header p{margin:2px 0;font-size:14px;opacity:.95}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.card h2{font-size:16px;margin:0 0 10px}
label.f{display:block;font-size:14px;margin-bottom:10px}
label.f span{display:block;margin-bottom:4px;color:var(--sub)}
input[type=text],input[type=tel],input[type=datetime-local],textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.req{color:var(--red)}
.flavor{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px}
.num{background:var(--brand);color:#fff;border-radius:50%;min-width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.tag{font-size:12px;font-weight:400;color:var(--sub)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.col{background:var(--chip);border-radius:10px;padding:8px}
.col h3{margin:0 0 6px;font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:6px}
.row small{font-size:12px;line-height:1.2}
.row small b{display:block;font-weight:600}
.row small i{font-style:normal;color:var(--sub)}
.step{display:flex;align-items:center;gap:2px}
.step button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:18px;line-height:1;cursor:pointer;padding:0}
.step output{min-width:22px;text-align:center;font-weight:700}
.step output.on{color:var(--red)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar .sum{font-size:14px}
.bar .sum b{font-size:20px;color:var(--red)}
.bar .warn{font-size:12px;color:var(--red)}
.bar .ok{font-size:12px;color:var(--brand)}
button.main{background:var(--red);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}
button.main:disabled{opacity:.4}
button.sec{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;margin-top:8px}
#result{display:none}
#result textarea{height:260px;font-size:14px}
.note{font-size:12px;color:var(--sub);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>🍕 達美樂歸仁店｜公司行號團購訂購單</h1>
<p>一次購買 5 顆以上，享團購外送優惠（最低訂購量五顆）</p>
<p>大披薩 250 元／顆　小披薩 180 元／顆</p>
<p>升級滋心餅皮：大 +115　小 +90</p>
<p>需提前預約・優惠至 115/12/27・電話 06-230-5252</p>
</header>

<div class="card">
<h2>訂購資料</h2>
<label class="f"><span>公司／訂購人姓名 <b class="req">*</b></span><input type="text" id="name"></label>
<label class="f"><span>聯絡電話 <b class="req">*</b></span><input type="tel" id="phone"></label>
<label class="f"><span>取餐／外送日期時間 <b class="req">*</b></span><input type="datetime-local" id="when"></label>
<label class="f"><span>外送地址（自取免填）</span><input type="text" id="addr"></label>
</div>

<div id="list"></div>

<div class="card">
<h2>備註</h2>
<textarea id="memo" rows="3" placeholder="如需加價換口味、額外加起司等"></textarea>
</div>

<div class="card" id="result">
<h2 id="resTitle">訂單內容</h2><p id="status" class="note"></p>
<textarea id="out" readonly></textarea>
<button class="sec" id="copy">複製訂單（備份）</button>
<p class="note">訂單已寄給店家，門市確認預約後才算訂購成功。如有疑問請致電 06-230-5252。若送出失敗，請複製上方內容傳給店家。</p>
</div>
</div>

<div class="bar"><div class="in">
<div class="sum"><div id="qtyLine">共 0 顆</div><b id="total">$0</b> <span id="hint" class="warn">　還差 5 顆</span></div>
<button class="main" id="submit" disabled>送出訂單</button>
</div></div>

<script>
var ENDPOINT='https://script.google.com/macros/s/AKfycbyxSW7FjuGum6fSA-dEpMOYuR2G6dPxFMM7slsnrF0PtHXhnqZMft3qxLJVcgYQumwA_A/exec';
var FLAVORS=['香草奶油烤雞','瑪格麗特','道地美國','總匯','墨西哥','招牌海鮮四喜','田園鮮蔬（可素食）','夏威夷','蟹肉鮮蝦沙拉','經典四喜','照燒花枝','起司餅','白醬彩蔬（素）','田園鮮蔬（可素食）'];
var TYPES=[
 {k:'LH',size:'大',crust:'手拍',price:250},
 {k:'LF',size:'大',crust:'滋心',price:365},
 {k:'SH',size:'小',crust:'手拍',price:180},
 {k:'SF',size:'小',crust:'滋心',price:270}
];
var qty={};
FLAVORS.forEach(function(_,i){TYPES.forEach(function(t){qty[i+'_'+t.k]=0;});});

function build(){
  var h='';
  FLAVORS.forEach(function(name,i){
    h+='<div class="card"><div class="flavor"><span class="num">'+(i+1)+'</span>'+name+'</div><div class="grid">';
    ['大','小'].forEach(function(size){
      h+='<div class="col"><h3>'+size+'披薩</h3>';
      TYPES.filter(function(t){return t.size===size;}).forEach(function(t){
        var id=i+'_'+t.k;
        h+='<div class="row"><small><b>'+t.crust+'</b><i>$'+t.price+'</i></small>'+
           '<div class="step"><button type="button" data-id="'+id+'" data-d="-1" aria-label="減少">−</button>'+
           '<output id="o_'+id+'">0</output>'+
           '<button type="button" data-id="'+id+'" data-d="1" aria-label="增加">+</button></div></div>';
      });
      h+='</div>';
    });
    h+='</div></div>';
  });
  document.getElementById('list').innerHTML=h;
}
build();

document.getElementById('list').addEventListener('click',function(e){
  var b=e.target.closest('button[data-id]'); if(!b) return;
  var id=b.getAttribute('data-id'), d=parseInt(b.getAttribute('data-d'),10);
  qty[id]=Math.max(0,Math.min(10,qty[id]+d));
  var o=document.getElementById('o_'+id);
  o.textContent=qty[id]; o.className=qty[id]>0?'on':'';
  update();
});

function totals(){
  var n=0,m=0;
  FLAVORS.forEach(function(_,i){TYPES.forEach(function(t){var q=qty[i+'_'+t.k];n+=q;m+=q*t.price;});});
  return {n:n,m:m};
}
function update(){
  var t=totals();
  document.getElementById('qtyLine').textContent='共 '+t.n+' 顆';
  document.getElementById('total').textContent='$'+t.m.toLocaleString();
  var hint=document.getElementById('hint');
  if(t.n<5){hint.textContent='　還差 '+(5-t.n)+' 顆';hint.className='warn';}
  else{hint.textContent='　✔ 已達團購門檻';hint.className='ok';}
  document.getElementById('submit').disabled=t.n<5;
}
update();

document.getElementById('submit').addEventListener('click',function(){
  var name=document.getElementById('name').value.trim();
  var phone=document.getElementById('phone').value.trim();
  var when=document.getElementById('when').value;
  if(!name||!phone||!when){alert('請填寫姓名、電話與取餐／外送時間');return;}
  var t=totals();
  var L=['【達美樂歸仁店｜團購訂單】','訂購人：'+name,'電話：'+phone,'時間：'+when.replace('T',' ')];
  var addr=document.getElementById('addr').value.trim();
  L.push('地址：'+(addr||'自取'));
  L.push('');
  FLAVORS.forEach(function(f,i){
    var parts=[];
    TYPES.forEach(function(ty){var q=qty[i+'_'+ty.k]; if(q>0) parts.push(ty.size+'披薩'+ty.crust+' x'+q);});
    if(parts.length) L.push((i+1)+'. '+f+'：'+parts.join('、'));
  });
  L.push('');
  L.push('總數量：'+t.n+' 顆');
  L.push('預估金額：$'+t.m.toLocaleString());
  var memo=document.getElementById('memo').value.trim();
  if(memo) L.push('備註：'+memo);
  var text=L.join('\n');
  document.getElementById('out').value=text;
  var r=document.getElementById('result'); r.style.display='block';
  var st=document.getElementById('status'), title=document.getElementById('resTitle'), btn=document.getElementById('submit');
  r.scrollIntoView({behavior:'smooth'});
  if(ENDPOINT.indexOf('http')!==0){title.textContent='尚未設定寄送網址';st.textContent='管理者尚未貼上 Web App 網址，請複製下方訂單內容傳給店家。';return;}
  btn.disabled=true; title.textContent='送出中…'; st.textContent='';
  var payload={name:name,phone:phone,when:when.replace('T',' '),addr:addr||'自取',total:t.m,count:t.n,text:text};
  fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
   .then(function(){title.textContent='✔ 訂單已送出';st.textContent='感謝您的訂購！店家收到後會與您聯絡確認。';})
   .catch(function(){title.textContent='送出失敗';st.textContent='請檢查網路後重試，或複製下方訂單內容傳給店家。';btn.disabled=false;});
});

document.getElementById('copy').addEventListener('click',function(){
  var ta=document.getElementById('out'); ta.select();
  var done=function(){document.getElementById('copy').textContent='已複製 ✔';};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(done,function(){document.execCommand('copy');done();});}
    else{document.execCommand('copy');done();}
  }catch(e){}
});
</script>
</body>
</html>
